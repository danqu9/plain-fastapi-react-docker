name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the AWS JWT token
  contents: read  # Required for actions/checkout

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::007927305675:role/github-ecr-oidc-role
  ECR_REPOSITORY: chigwell/plain-fastapi-react-docker
  ECS_CLUSTER_NAME: my-dynamic-cluster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define a list of your services, their corresponding ECR repo names, and Dockerfile paths
        include:
          - service_name: frontend
            tag: frontend-latest
            repo_name: my-web-app-repo
            context_dir: ./frontend
          - service_name: backend
            tag: backend-latest
            repo_name: my-api-repo
            context_dir: ./backend

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, tag, and push image to Amazon ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Build and push Image A (e.g., frontend)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ matrix.tag }} ${{ matrix.context_dir }}
          # -f ./frontend/Dockerfile ./frontend
          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG -f ./frontend/Dockerfile ./frontend
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ matrix.tag }}
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
          
          # 2. Build and push Image B (e.g., backend)
          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest -f ./backend/Dockerfile ./backend
          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG -f ./backend/Dockerfile ./backend
          
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG


          # Build the container using the matrix directory context

          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest -f ./frontend/Dockerfile ./frontend
          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG -f ./frontend/Dockerfile ./frontend
          
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG

          ###


          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ${{ matrix.context_dir }}
          ##docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
          # Push both the SHA tag and the latest tag to ECR
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest


      - name: Setup SSH over SSM
        uses: ankurk91/setup-ssh-over-ssm-action@v1
        with:
          instance-id: i-0d95f6af1ed2a3f6a
          #os-user: ubuntu                 # User matching your OS (ubuntu or ec2-user)

      #- name: Execute Remote SSH Commands
      #  run: |
      #      echo "Successfully connected!"
      #      uname -a
      #      docker ps -a
      #
  provision-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Best Practice: Use OpenID Connect (OIDC) Role instead of long-lived keys
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECS Cluster
        run: |
          echo "Checking if ECS cluster ${{ env.ECS_CLUSTER_NAME }} already exists..."
          CLUSTER_EXISTS=$(aws ecs list-clusters --query "clusterArns[?contains(@, '${{ env.ECS_CLUSTER_NAME }}')]" --output text)
          
          if [ -z "$CLUSTER_EXISTS" ]; then
            echo "Cluster not found. Creating ECS cluster..."
            aws ecs create-cluster --cluster-name ${{ env.ECS_CLUSTER_NAME }}
          else
            echo "ECS cluster ${{ env.ECS_CLUSTER_NAME }} already exists. Skipping creation."
          fi
