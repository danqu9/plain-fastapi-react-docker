name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the AWS JWT token
  contents: read  # Required for actions/checkout

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::007927305675:role/github-ecr-oidc-role
  ECR_REPOSITORY: chigwell/plain-fastapi-react-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define a list of your services, their corresponding ECR repo names, and Dockerfile paths
        include:
          - service_name: web-app
            repo_name: my-web-app-repo
            context_dir: ./frontend
          - service_name: api-service
            repo_name: my-api-repo
            context_dir: ./backend

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, tag, and push image to Amazon ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the container using the matrix directory context
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ${{ matrix.context_dir }}
          #docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
          # Push both the SHA tag and the latest tag to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
